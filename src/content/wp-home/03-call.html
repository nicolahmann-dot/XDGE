


<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500&amp;display=swap" rel="stylesheet">

<style>

/* =====================================================
   FOUNDATION
===================================================== */

#xdge-floating-call,
#xdge-floating-call * {
  box-sizing: border-box !important;
}

/* =====================================================
   FIXED POSITION
===================================================== */

#xdge-floating-call {

  position: fixed !important;

  right: 25px !important;
  bottom: 25px !important;

  top: auto !important;
  left: auto !important;

  width: 300px !important;
  max-width: calc(100vw - 32px) !important;

  height: auto !important;

  z-index: 2147483647 !important;

  display: block !important;
  visibility: visible !important;
  opacity: 1 !important;

  margin: 0 !important;
  padding: 0 !important;

  float: none !important;
  clear: none !important;

  transform: none !important;
  animation: none !important;
  filter: none !important;

  overflow: visible !important;

  font-family: "Manrope", Arial, sans-serif !important;

  pointer-events: auto !important;

}

/* =====================================================
   BUTTON DESIGN
===================================================== */

#xdge-floating-call .xdge-call-button {

  display: flex !important;

  align-items: center !important;
  justify-content: space-between !important;

  width: 100% !important;
  min-height: 54px !important;

  padding: 12px 20px !important;
  gap: 10px !important;

  background: linear-gradient(
    110deg,
    #14203D 0%,
    #1A376A 48%,
    #285E9F 100%
  ) !important;

  border: 1px solid #8399BC !important;

  border-radius: 13px !important;

  color: #FFFFFF !important;
  text-decoration: none !important;

  box-shadow:
    0 8px 18px rgba(17,30,55,.22),
    0 2px 5px rgba(0,0,0,.10) !important;

  transition:
    transform .3s ease,
    box-shadow .3s ease;

  cursor: pointer !important;

}

/* =====================================================
   BUTTON TEXT
===================================================== */

#xdge-floating-call .xdge-call-text {

  color: #FFFFFF !important;

  font-family: "Manrope", Arial, sans-serif !important;

  font-size: 14px !important;
  font-weight: 500 !important;

  line-height: 1.3 !important;
  letter-spacing: -.02em !important;

  white-space: nowrap;

}

/* =====================================================
   ARROW
===================================================== */

#xdge-floating-call .xdge-call-arrow {

  display: flex;
  align-items: center;
  justify-content: center;

  flex: 0 0 22px;

  width: 22px;
  height: 22px;

}

#xdge-floating-call .xdge-call-arrow svg {

  display: block;

  width: 22px;
  height: 22px;

  fill: none;
  stroke: #FFFFFF;

  stroke-width: 2;
  stroke-linecap: square;
  stroke-linejoin: miter;

}

/* =====================================================
   HOVER
===================================================== */

#xdge-floating-call .xdge-call-button:hover {

  transform: translateY(-2px);

  box-shadow:
    0 11px 22px rgba(17,30,55,.28) !important;

}

#xdge-floating-call .xdge-call-button:focus-visible {

  outline: 2px solid #5170FF !important;
  outline-offset: 3px !important;

}

/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

  #xdge-floating-call {

    right: 12px !important;
    bottom: 14px !important;

    width: 268px !important;

    max-width: calc(100vw - 24px) !important;

  }

  #xdge-floating-call .xdge-call-button {

    min-height: 48px !important;

    padding: 11px 14px !important;

    border-radius: 12px !important;

  }

  #xdge-floating-call .xdge-call-text {

    font-size: 12px !important;

  }

  #xdge-floating-call .xdge-call-arrow,
  #xdge-floating-call .xdge-call-arrow svg {

    width: 19px;
    height: 19px;

  }

  #xdge-floating-call .xdge-call-arrow {

    flex-basis: 19px;

  }

}

/* =====================================================
   REDUCED MOTION
===================================================== */

@media (prefers-reduced-motion: reduce) {

  #xdge-floating-call .xdge-call-button {

    transition: none !important;

  }

}

</style>




<div id="xdge-floating-call">

  <a class="xdge-call-button" href="https://calendly.com/thexdge/strategy-session" target="_blank" rel="noopener noreferrer" aria-label="Schedule Your Discovery Call">

    <span class="xdge-call-text">
      Schedule Your Discovery Call
    </span>

    <span class="xdge-call-arrow" aria-hidden="true">

      <svg viewBox="0 0 48 48">

        <path d="M9 39L39 9"></path>

        <path d="M21 9h18v18"></path>

      </svg>

    </span>

  </a>

</div>




<script>

(function () {

  "use strict";

  var observerStarted = false;

  function mountXDGEButton() {

    var button = document.getElementById(
      "xdge-floating-call"
    );

    if (!button || !document.body) {
      return;
    }

    /* Move button directly into the body */

    if (button.parentElement !== document.body) {

      document.body.appendChild(button);

    }

    /* Reinforce fixed positioning */

    button.style.setProperty(
      "position",
      "fixed",
      "important"
    );

    button.style.setProperty(
      "right",
      window.innerWidth <= 600 ? "12px" : "25px",
      "important"
    );

    button.style.setProperty(
      "bottom",
      window.innerWidth <= 600 ? "14px" : "25px",
      "important"
    );

    button.style.setProperty(
      "top",
      "auto",
      "important"
    );

    button.style.setProperty(
      "left",
      "auto",
      "important"
    );

    button.style.setProperty(
      "z-index",
      "2147483647",
      "important"
    );

    button.style.setProperty(
      "visibility",
      "visible",
      "important"
    );

    button.style.setProperty(
      "opacity",
      "1",
      "important"
    );

    button.style.setProperty(
      "transform",
      "none",
      "important"
    );

  }

  /* Watch for page-builder changes */

  function watchXDGEButton() {

    if (observerStarted || !document.body) {
      return;
    }

    observerStarted = true;

    var observer = new MutationObserver(function () {

      var button = document.getElementById(
        "xdge-floating-call"
      );

      if (
        button &&
        button.parentElement !== document.body
      ) {

        mountXDGEButton();

      }

    });

    observer.observe(document.body, {

      childList: true,
      subtree: true

    });

  }

  function initialiseXDGEButton() {

    mountXDGEButton();
    watchXDGEButton();

  }

  /* Initialise */

  initialiseXDGEButton();

  /* DOM ready */

  if (document.readyState === "loading") {

    document.addEventListener(
      "DOMContentLoaded",
      initialiseXDGEButton
    );

  }

  /* Full page load */

  window.addEventListener(
    "load",
    initialiseXDGEButton
  );

  /* Browser back / forward */

  window.addEventListener(
    "pageshow",
    initialiseXDGEButton
  );

  /* Screen-size changes */

  window.addEventListener(
    "resize",
    mountXDGEButton
  );

  /* Delayed SeedProd rendering */

  setTimeout(initialiseXDGEButton, 300);
  setTimeout(initialiseXDGEButton, 1000);
  setTimeout(initialiseXDGEButton, 2500);

})();

</script>
