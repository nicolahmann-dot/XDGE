<style>

/* BASE */

.xdge-thin-strip,
.xdge-thin-strip * {
  box-sizing: border-box;
}

.xdge-thin-strip {
  width: 100%;
  background: #000000;
  color: #ffffff;

  padding: 12px 0;

  overflow-x: auto;
  overflow-y: hidden;

  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;

  font-family: 'Noto Sans', Arial, sans-serif;
}

.xdge-thin-strip::-webkit-scrollbar {
  display: none;
}

/* HORIZONTAL LAYOUT */

.xdge-thin-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;

  width: 100%;
  min-width: 1140px;
  max-width: 2100px;

  margin: 0 auto;
}

/* INDIVIDUAL FEATURES */

.xdge-thin-item {
  flex: 1 1 0;
  min-width: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  gap: clamp(10px, 1.2vw, 22px);

  padding: 5px clamp(10px, 1.3vw, 24px);

  min-height: 66px;

  border-right: 1px solid #515151;
}

/* ALLOW LONGER FIRST HEADING */

.xdge-thin-item:first-child {
  flex: 1.3 1 0;
}

/* ONLINE + IN PERSON */

.xdge-thin-item:nth-child(5) {
  flex: 1.15 1 0;
}

.xdge-thin-item:last-child {
  border-right: none;
}

/* ICONS */

.xdge-thin-icon {
  width: clamp(34px, 2.8vw, 48px);
  height: clamp(34px, 2.8vw, 48px);

  flex: 0 0 auto;

  color: #ffffff;
}

.xdge-thin-icon svg {
  display: block;
  width: 100%;
  height: 100%;

  fill: none;
  stroke: currentColor;
  stroke-width: 1.15;

  stroke-linecap: round;
  stroke-linejoin: round;
}

/* TYPOGRAPHY */

.xdge-thin-text {

  font-family: 'Noto Sans', Arial, sans-serif;

  font-size: clamp(11px, 1.05vw, 16px);
  line-height: 1.5;

  letter-spacing: 0.045em;
  text-transform: uppercase;
  white-space: nowrap;
}

.xdge-thin-text span {
  display: block;
}

/* TABLET + MOBILE */
/* Retain one scrollable row */

@media (max-width: 1140px) {

  .xdge-thin-inner {
    width: 1140px;
    min-width: 1140px;
  }

  .xdge-thin-text {
    font-size: 12px;
  }

  .xdge-thin-icon {
    width: 38px;
    height: 38px;
  }

  .xdge-thin-item {
    gap: 12px;
    min-height: 62px;
  }
}

</style>
